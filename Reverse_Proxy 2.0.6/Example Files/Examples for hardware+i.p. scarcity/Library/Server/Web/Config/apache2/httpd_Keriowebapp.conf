# from http://httpd.apache.org/docs/2.2/mod/mod_proxy.html#proxypass
RewriteEngine On

RewriteCond %{HTTPS} =off
RewriteRule . - [E=protocol:http,E=port:8003]
RewriteCond %{HTTPS} =on
RewriteRule . - [E=protocol:https,E=port:8013]

ProxyPassReverse / http://kerio.precursor.ca:8003/
ProxyPass / http://kerio.precursor.ca:8003/
