<VirtualHost *:80>
	ServerName home.example.com
	ServerAdmin admin@example.com
	ErrorLog "/private/var/log/apache2/home.example.com-error_log"
 	CustomLog "/private/var/log/apache2/home.example.com-access_log" common
	ProxyRequests off
	RewriteEngine On
	RewriteCond %{HTTPS} =off
	RewriteRule . - [E=protocol:http,E=port:80]
	RewriteCond %{HTTPS} =on
	RewriteRule . - [E=protocol:https,E=port:443]
	ProxyPreserveHost On
	ProxyPassReverse / http://192.168.0.11:8581/
	ProxyPass / http://192.168.0.11:8581/
	LogLevel warn
</VirtualHost>
