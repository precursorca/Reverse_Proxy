<VirtualHost *:80>
	ServerName filemaker.example.com
	ServerAdmin admin@example.com
	ErrorLog "/private/var/log/apache2/filemaker.example.com-error_log"
 	CustomLog "/private/var/log/apache2/filemaker.example.com-access_log" common
	ProxyRequests off
	RewriteEngine On
	RewriteCond %{HTTPS} =off
	RewriteRule . - [E=protocol:http,E=port:80]
	RewriteCond %{HTTPS} =on
	RewriteRule . - [E=protocol:https,E=port:443]
	RewriteRule .* https://filemaker.example.com%{REQUEST_URI} [R]
	ProxyPreserveHost On
	ProxyPassReverse / http://192.168.0.13/
	ProxyPass / http://192.168.0.13/
	LogLevel warn
</VirtualHost>


<VirtualHost *:443>
	ServerName filemaker.example.com:443
	ServerAdmin admin@example.com
	#**Load Balancing: If you are using load balancing uncomment the following one line
	#RequestHeader set X-Forwarded-Proto "https"
	#**End of Load Balancing**
	ErrorLog "/private/var/log/apache2/filemaker.example.com-error_log"
 	CustomLog "/private/var/log/apache2/filemaker.example.com-access_log" common
	<IfModule mod_ssl.c>
		SSLEngine On
		SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProtocol -all +TLSv1.2
		SSLProxyProtocol -all +TLSv1.2
		SSLCertificateFile "/private/etc/apache2/certificates/filemaker_example_com.crt"
		SSLCertificateKeyFile "/private/etc/apache2/certificates/filemaker_example_com.key"
		SSLCertificateChainFile "/private/etc/apache2/certificates/intermediate_cert_bundle.crt"
	</IfModule>
	ProxyRequests Off
	RewriteCond %{HTTPS} =off
	RewriteRule . - [E=protocol:http,E=port:80]
	RewriteCond %{HTTPS} =on
	RewriteRule . - [E=protocol:https,E=port:443]
	SSLEngine On
	SSLProxyEngine On
	SSLProxyVerify none 
	SSLProxyCheckPeerCN off
	SSLProxyCheckPeerName off
	SSLProxyCheckPeerExpire off
	ProxyPreserveHost On
	#**AZURE OAUTH: Uncomment and edit the following four lines for Azure Oauth**
	#RewriteRule ^/oauth2/(.*) https://filemaker.example.com/oauth2/$1 [P]
	#ProxyPassReverse  /oauth2 [https://filemaker.example.com/oauth2/](https://filemaker.example.com/oauth2/)
	#RewriteRule ^/login/oauth2/(.*) https://filemaker.example.com/login/oauth2/$1 [P]
	#ProxyPassReverse  /login/oauth2 https://filemaker.example.com/login/oauth2/
	#**End of Azure Oauth**
	#**WEBSOCKETS: (required for FMS WebDirect Master and Workers, also called primary and secondary machines)**
	#**Uncomment and edit the following five lines for Web Sockets**	#RewriteCond ${HTTP:Upgrade} websocket [NC]
  	#RewriteCond ${HTTP:Connection} upgrade [NC]
  	#RewriteRule /(.*) "wss://192.168.1.201/$1" [P,L]
	#ProxyPass "/fmi/webd/PUSH" "wss://192.168.1.201/fmi/webd/PUSH"
	#ProxyPassReverse "/fmi/webd/PUSH" "wss://192.168.1.201/fmi/webd/PUSH"
	#**End of Web Sockets**
	ProxyPass / https://192.168.0.13/
	ProxyPassReverse / https://192.168.0.13/
	LogLevel warn
</VirtualHost>
