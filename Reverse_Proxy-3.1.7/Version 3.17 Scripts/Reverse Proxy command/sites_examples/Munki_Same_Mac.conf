<VirtualHost *:80>
	ServerName munki.example.com
	ServerAdmin admin@example.com
	DocumentRoot "/Library/WebServer/munki.example.com
	DirectoryIndex index.html index.php default.html
	ErrorLog "/private/var/log/apache2/munki.example.com-error_log"
 	CustomLog "/private/var/log/apache2/munki.example.com-access_log" common
	<IfModule mod_headers.c>
    	Header set Connection keep-alive
	</IfModule>
	<Directory "/Library/WebServer/munki.example.com">
		Options All -Indexes -ExecCGI -Includes +MultiViews
		AllowOverride None
		Require all granted
		<IfModule mod_dav.c>
			DAV Off
		</IfModule>
	</Directory>
	LogLevel warn
</VirtualHost>


<VirtualHost *:443>
	ServerName munki.example.com:443
	ServerAdmin admin@example.com
	DocumentRoot "/Library/WebServer/munki.example.com
	DirectoryIndex index.html index.php default.html
	ErrorLog "/private/var/log/apache2/munki.example.com-error_log"
 	CustomLog "/private/var/log/apache2/munki.example.com-access_log" common
	<IfModule mod_ssl.c>
		SSLEngine On
		SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProtocol -all +TLSv1.2
		SSLProxyProtocol -all +TLSv1.2
		SSLCertificateFile "/private/etc/apache2/certificates/munki_example_com.crt"
		SSLCertificateKeyFile "/private/etc/apache2/certificates/munki_example_com.key"
		SSLCertificateChainFile "/private/etc/apache2/certificates/intermediate_cert_bundle.crt"
	</IfModule>
	<IfModule mod_headers.c>
    	Header set Connection keep-alive
	</IfModule>
	<Directory "/Library/WebServer/munki.example.com">
		Options All -Indexes -ExecCGI -Includes +MultiViews
		AllowOverride None
		Require all granted
		<IfModule mod_dav.c>
			DAV Off
		</IfModule>
	</Directory>
	LogLevel warn
</VirtualHost>
