<VirtualHost *:80>
	ServerName synology.example.com
	ServerAdmin admin@example.com
	ErrorLog "/private/var/log/apache2/synology.example.com-error_log"
 	CustomLog "/private/var/log/apache2/synology.example.com-access_log" common
	ProxyRequests off
	RewriteEngine On
	RewriteCond %{HTTPS} =off
	RewriteRule . - [E=protocol:http,E=port:80]
	RewriteCond %{HTTPS} =on
	RewriteRule . - [E=protocol:https,E=port:443]
	RewriteRule .* https://synology.example.com%{REQUEST_URI} [R]
	ProxyPreserveHost On
	ProxyPassReverse / http://192.168.0.11:5000/
	ProxyPass / http://192.168.0.11:5000/
	LogLevel warn
</VirtualHost>


<VirtualHost *:443>
	ServerName synology.example.com:443
	ServerAdmin admin@example.com
	ErrorLog "/private/var/log/apache2/synology.example.com-error_log"
 	CustomLog "/private/var/log/apache2/synology.example.com-access_log" common
	<IfModule mod_ssl.c>
		SSLEngine On
		SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProtocol -all +TLSv1.2
		SSLProxyProtocol -all +TLSv1.2
		SSLCertificateFile "/private/etc/apache2/certificates/synology_example_com.crt"
		SSLCertificateKeyFile "/private/etc/apache2/certificates/synology_example_com.key"
		SSLCertificateChainFile "/private/etc/apache2/certificates/intermediate_cert_bundle.crt"
	</IfModule>
	ProxyRequests Off
	RewriteCond %{HTTPS} =off
	RewriteRule . - [E=protocol:http,E=port:80]
	RewriteCond %{HTTPS} =on
	RewriteRule . - [E=protocol:https,E=port:443]
	SSLEngine On
	SSLProxyEngine On
	SSLProxyVerify none 
	SSLProxyCheckPeerCN off
	SSLProxyCheckPeerName off
	SSLProxyCheckPeerExpire off
	ProxyPreserveHost On
	ProxyPass / https://192.168.0.11:5001/
	ProxyPassReverse / https://192.168.0.11:5001/
	LogLevel warn
</VirtualHost>
