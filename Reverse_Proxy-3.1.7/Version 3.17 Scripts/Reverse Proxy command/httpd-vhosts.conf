# Virtual Hosts
#
# Required modules: mod_log_config

# If you want to maintain multiple domains/hostnames on your
# machine you can setup VirtualHost containers for them. Most configurations
# use only name-based virtual hosts so the server doesn't need to worry about
# IP addresses. This is indicated by the asterisks in the directives below.
#
# Please see the documentation at 
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# for further details before you try to setup virtual hosts.
#
# You may use the command line option '-S' to verify your virtual host
# configuration.

#
# VirtualHost example:
# Almost any Apache directive may go into a VirtualHost container.
# The first VirtualHost section is used for all requests that do not
# match a ServerName or ServerAlias in any <VirtualHost> block.
#
#<VirtualHost *:80>
#    ServerAdmin webmaster@dummy-host.example.com
#    DocumentRoot "/usr/docs/dummy-host.example.com"
#    ServerName dummy-host.example.com
#    ServerAlias www.dummy-host.example.com
 #   ErrorLog "/private/var/log/apache2/dummy-host.example.com-error_log"
 #   CustomLog "/private/var/log/apache2/dummy-host.example.com-access_log" common
#</VirtualHost>

#<VirtualHost *:80>
#    ServerAdmin webmaster@dummy-host2.example.com
#    DocumentRoot "/usr/docs/dummy-host2.example.com"
#    ServerName dummy-host2.example.com
#    ErrorLog "/private/var/log/apache2/dummy-host2.example.com-error_log"
#    CustomLog "/private/var/log/apache2/dummy-host2.example.com-access_log" common
#</VirtualHost>

#PRIMARY HOST - edit the following as per the guide and your circumstances
#Uncomment the Rewrite lines to automatically send HTTP port 80 to HTTPS port 443
<VirtualHost *:80 >
	ServerName apache.example.com
	ServerAdmin admin@example.com
	DocumentRoot "/Library/WebServer/Documents"
	DirectoryIndex index.html index.php
	ErrorLog "/private/var/log/apache2/apache.example.com-error_log"
 	CustomLog "/private/var/log/apache2/apache.example.com-access_log" common
	<IfModule mod_headers.c>
    	Header set Connection keep-alive
	</IfModule>
	<Directory “/Library/WebServer/Documents">
		Options All -Indexes -ExecCGI -Includes +MultiViews
		AllowOverride None
		<IfModule mod_dav.c>
			DAV Off
		</IfModule>
	</Directory>
	#RewriteEngine On
	#RewriteCond %{HTTP_HOST} !(^localhost|^127.0.0.1|^::1)
	#RewriteCond %{REQUEST_URI} !^/netboot/ [NC]
	#RewriteRule .* https://%{SERVER_NAME}%{REQUEST_URI} [R]
</VirtualHost>	

#PRIMARY SSL HOST - edit the following as per the guide and your circumstances
<VirtualHost *:443 >
	ServerName apache.example.com:443
	ServerAdmin admin@example.com
	DocumentRoot "/Library/WebServer/Documents"
	DirectoryIndex index.html index.php default.html
	ErrorLog "/private/var/log/apache2/apache.example.com-error_log"
 	CustomLog "/private/var/log/apache2/apache.example.com-access_log" common
	<IfModule mod_headers.c>
    	Header set Connection keep-alive
	</IfModule>
	<IfModule mod_ssl.c>
		SSLEngine On
		SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
		SSLProtocol -all +TLSv1.2
		SSLProxyProtocol -all +TLSv1.2
		SSLCertificateFile "/private/etc/apache2/certificates/apache_example_com.crt.pem"
		SSLCertificateKeyFile "/private/etc/apache2/certificates/apache_example.com_key.pem"
	   #SSLCertificateChainFile "/private/etc/apache2/certificates/intermediate_cert_bundle.key.pem"
	</IfModule>
	<Directory "/Library/WebServer/Documents">
		Options All -Indexes -ExecCGI -Includes +MultiViews
		AllowOverride None
		<IfModule mod_dav.c>
			DAV Off
		</IfModule>
	</Directory>
</VirtualHost>	

